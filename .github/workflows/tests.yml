name: Tests

on:
  push:
    branches: [main]
    paths:                    # only when code or the tests change: the nightly data commits don't run them
      - "**.py"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/tests.yml"
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read              # reads the repository, never writes to it

concurrency:
  group: tests
  cancel-in-progress: true    # a newer upload replaces a test run still going

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt playwright==1.63.0
      - name: Install the browser the page tests use
        run: python -m playwright install --with-deps chromium

      - name: Run every test, each on a throwaway copy of the repository (Node, for the Zerodha test, comes with the machine)
        run: python tests/run_tests.py
