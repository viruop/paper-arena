name: Daily paper arena

on:
  schedule:
    - cron: "17 15 * * 1-5"   # 8:47 pm IST, Monday to Friday (off the hour: runs set for :00 often start hours late)
    - cron: "43 16 * * 1-5"   # 10:13 pm IST, a backup run in case the data was late
  push:
    branches: [main]          # rebuild the page whenever you edit a file, e.g. to add your own call
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write             # lets the run save decisions and logs in the repository
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Start from the newest commit on main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Claude agent decides (only with the ANTHROPIC_API_KEY secret)
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python claude_agent.py

      - name: Update saved ETF, gold, silver and S&P 500 prices
        continue-on-error: true   # if Yahoo can't be reached, the saved copies in data/market are used
        run: python market_data.py

      - name: Download NSE option prices for the F&O agents
        continue-on-error: true   # if NSE can't be reached, the F&O agents use estimated prices
        run: python fno_prices.py

      - name: Trade Like Berlin - save Telegram posts and paper trade his calls
        continue-on-error: true   # if Telegram or Yahoo can't be reached, it tries again the next night
        run: python berlin_calls.py

      - name: Add the newest days to the permanent logs
        run: python logbook.py

      - name: Save decisions, logs and option prices
        run: |
          if [ -n "$(git status --porcelain decisions logs data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add decisions logs
            if [ -d data ]; then git add data; fi
            git commit -m "Arena logs and decisions, $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - run: python build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
