name: Daily paper arena

on:
  schedule:
    - cron: "0 15 * * 1-5"    # 8:30 pm IST, Monday to Friday (the free data updates around 7:30 pm IST)
    - cron: "30 17 * * 1-5"   # 11:00 pm IST, a backup run in case the data was late
  push:
    branches: [main]          # rebuild the page whenever you edit a file, e.g. to add your own call
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
