name: Daily paper arena

on:
  schedule:
    - cron: "0 15 * * 1-5"    # 8:30 pm IST, Monday to Friday (the free data updates around 7:30 pm IST)
    - cron: "30 17 * * 1-5"   # 11:00 pm IST, a backup run in case the data was late
  push:
    branches: [main]          # rebuild the page whenever you edit a file, e.g. to add your own call
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write             # lets the run save Claude's decision in decisions/claude.json
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Claude agent decides (needs the ANTHROPIC_API_KEY secret)
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python claude_agent.py

      - name: Save Claude's decision
        if: github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain decisions)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add decisions
            git commit -m "Claude agent decision"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - run: python build_site.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
