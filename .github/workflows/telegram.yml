name: Save Telegram posts

on:
  schedule:
    - cron: "13,43 * * * *"   # every 30 minutes, day and night (he also posts at night)
  workflow_run:                   # also right after every arena run (8:47 and 10:13 pm IST, and after each
    workflows: ["Daily paper arena"]  # upload), because GitHub often skips the 30-minute runs above
    types: [completed]
  workflow_dispatch:              # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write                 # lets the run save new posts in the repository

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 20             # the first voice-note run downloads the speech model
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas numpy

      - name: Save new and changed posts from every channel, and read the signal channels' signals
        run: python channels.py

      - name: Any voice notes to transcribe?
        id: voice
        continue-on-error: true           # never stops the posts from being saved; if the count fails, the next step runs anyway
        run: echo "pending=$(python voice_notes.py --pending || echo unknown)" >> "$GITHUB_OUTPUT"

      - name: Restore the speech model (Whisper small, about 360 MB)
        id: model
        if: steps.voice.outputs.pending != '0'
        uses: actions/cache/restore@v6
        with:
          path: models/sherpa-onnx-whisper-small   # must be the same path as the save step below
          key: whisper-small-sherpa-onnx-v1

      - name: Transcribe new voice notes into English text
        if: steps.voice.outputs.pending != '0'
        continue-on-error: true           # the posts are saved either way; it tries again next run
        timeout-minutes: 15               # the script itself stops starting new ones after 8 minutes
        run: |
          pip install sherpa-onnx==2.0.1 av==19.0.2
          python voice_notes.py

      - name: Keep the speech model for later runs (only once it downloaded completely)
        if: steps.voice.outputs.pending != '0' && steps.model.outputs.cache-hit != 'true' && hashFiles('models/sherpa-onnx-whisper-small/small-tokens.txt') != ''
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: models/sherpa-onnx-whisper-small
          key: whisper-small-sherpa-onnx-v1

      - name: Commit them, if any
        run: |
          if [ -n "$(git status --porcelain data/berlin data/akash)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/berlin
            if [ -d data/akash ]; then git add data/akash; fi
            git commit -m "Telegram posts, $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 5
            done
          fi
