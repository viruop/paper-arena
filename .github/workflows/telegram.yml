name: Save Telegram posts

on:
  schedule:
    - cron: "13,43 3-18 * * *"   # every 30 minutes, about 8:45 am to 12:15 am IST, every day
  workflow_dispatch:              # adds a "Run workflow" button on the Actions tab

permissions:
  contents: write                 # lets the run save new posts in the repository

concurrency:
  group: telegram
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pandas numpy

      - name: Save new and changed posts from the Trade Like Berlin channel
        run: python -c "import berlin_calls as bc; print(f'Saved {bc.archive()} new or changed posts.')"

      - name: Commit them, if any
        run: |
          if [ -n "$(git status --porcelain data/berlin)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/berlin
            git commit -m "Telegram posts, $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && break
              sleep 5
            done
          fi
